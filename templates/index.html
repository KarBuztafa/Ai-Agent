<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual-AI Agent</title>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: #fff; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .box { width: 100%; max-width: 600px; background: #161b22; padding: 20px; border-radius: 10px; border: 1px solid #30363d; }
        textarea { width: 100%; height: 90px; background: #0d1117; color: #fff; border: 1px solid #30363d; padding: 10px; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; background: #238636; color: white; padding: 12px; border: none; margin-top: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        #status { margin-top: 10px; font-size: 14px; color: #8b949e; text-align: center; }
        #output { margin-top: 15px; background: #0d1117; padding: 12px; border-radius: 5px; border: 1px solid #30363d; white-space: pre-wrap; display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>⚡ Dual-AI Agent (Groq + Gemini)</h2>
        <textarea id="task" placeholder="Ajana bir görev verin..."></textarea>
        <button onclick="send()">Görevi Başlat</button>
        <div id="status"></div>
        <div id="output"></div>
    </div>
    <script>
        async function send() {
            const task = document.getElementById('task').value;
            const status = document.getElementById('status');
            const output = document.getElementById('output');
            if(!task) return alert('Lütfen bir görev yazın!');
            status.innerText = '🧠 Patron (Groq) görevi planlıyor ve Çalışan (Gemini) üretiyor...';
            output.style.display = 'none';
            try {
                const res = await fetch('/process', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({task})
                });
                const data = await res.json();
                status.innerText = '✅ İşlem Tamamlandı!';
                output.innerText = data.result || data.error;
                output.style.display = 'block';
            } catch(e) {
                status.innerText = '❌ Bir hata oluştu!';
            }
        }
    </script>
</body>
</html>
